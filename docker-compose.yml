services:
  mongodb:
    image: mongo:7
    container_name: digiarch-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: digiach
    networks:
      - digiarch-network

  minio:
    image: minio/minio:latest
    container_name: digiarch-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - digiarch-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digiarch-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/digiach
      MONGO_DB: digiach
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: 7d
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: archives
      MINIO_PUBLIC_URL: http://minio:9000
      MINIO_CONSOLE_PORT: 9001
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      FRONTEND_URL: http://localhost:3001
    depends_on:
      mongodb:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - digiarch-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digiarch-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - digiarch-network

volumes:
  mongodb_data:
    driver: local
  minio_data:
    driver: local

networks:
  digiarch-network:
    driver: bridge
